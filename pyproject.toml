[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-agent-behavior"
version = "0.1.0"
description = "Deterministic pytest assertions for AI agent tool calls, approval ordering, and repeated-call limits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Varun Talari", email = "varun.talari1@gmail.com" },
]
keywords = ["pytest", "testing", "agent", "tool-calls", "deterministic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["pytest>=8.3,<10"]

[project.optional-dependencies]
test = [
  "jsonschema>=4.21,<5",
  "pytest>=8.3,<10",
]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.21,<5",
  "mypy>=1.10,<3",
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "twine>=7,<8",
]

[project.entry-points.pytest11]
agent_behavior = "pytest_agent_behavior.plugin"

[project.urls]
Repository = "https://github.com/VarunTx/pytest-agent-behavior"
Issues = "https://github.com/VarunTx/pytest-agent-behavior/issues"
Documentation = "https://github.com/VarunTx/pytest-agent-behavior/blob/main/docs/api.md"
Changelog = "https://github.com/VarunTx/pytest-agent-behavior/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_agent_behavior"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/tests"]
pythonpath = ["examples"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pytest_agent_behavior"]
